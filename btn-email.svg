<svg xmlns="http://www.w3.org/2000/svg" width="232" height="78" viewBox="0 0 232 78" role="img" aria-label="Email">
<title>Email</title>
<defs>
  <filter id="blur" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
    <stop offset=".55" stop-color="#fff" stop-opacity=".04"/>
    <stop offset="1" stop-color="#000" stop-opacity=".08"/>
  </linearGradient>
</defs>
<style>
  .face{animation:press 3.4s cubic-bezier(.4,0,.2,1) infinite;animation-delay:2.1s}
  .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3.4s cubic-bezier(.4,0,.2,1) infinite;animation-delay:2.1s}
  .ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 3.4s ease-out infinite;animation-delay:2.1s}
  @keyframes press{
    0%,52%{transform:translateY(0)}
    58%{transform:translateY(6px)}
    68%{transform:translateY(6px)}
    78%{transform:translateY(-3px)}
    86%{transform:translateY(0.8px)}
    92%,100%{transform:translateY(0)}
  }
  @keyframes shadow{
    0%,52%{transform:scale(1,1);opacity:.45}
    58%,68%{transform:scale(.82,.55);opacity:.22}
    78%{transform:scale(1.06,1.15);opacity:.5}
    92%,100%{transform:scale(1,1);opacity:.45}
  }
  @keyframes ring{
    0%,64%{opacity:0;transform:scale(.96)}
    66%{opacity:.55;transform:scale(.98)}
    84%,100%{opacity:0;transform:scale(1.12,1.5)}
  }
</style>
<!-- soft shadow on the ground -->
<ellipse class="shadow" cx="116.0" cy="69" rx="96.0" ry="6" fill="#000" filter="url(#blur)"/>
<!-- solid edge under the button (the 3D side) -->
<rect x="14" y="16" width="204" height="46" rx="15" fill="#86AB1F"/>
<!-- press ripple -->
<rect class="ring" x="14" y="16" width="204" height="46" rx="15" fill="none" stroke="#C6FF3D" stroke-width="2"/>
<!-- the button face that moves -->
<g class="face">
  <rect x="14" y="10" width="204" height="46" rx="15" fill="#C6FF3D"/>
  <rect x="14" y="10" width="204" height="46" rx="15" fill="url(#gloss)"/>
  <g transform="translate(77.5,21.5)"><rect x="0" y="2" width="23" height="17" rx="3" fill="none" stroke="#0d1117" stroke-width="2.4"/><path d="M1.5 4.5l10 8 10-8" fill="none" stroke="#0d1117" stroke-width="2.4" stroke-linejoin="round"/></g>
  <text x="111.5" y="38.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0d1117">Email</text>
</g>
</svg>
